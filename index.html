<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تي إكليسيا للمستلزمات الكنسية</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1c1c7c;--navy2:#13135a;--cream:#fdfbe0;--paper:#fffef3;--line:#e3dfae;--ink:#17174a;--mute:#6b6a8f;--red:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--cream);color:var(--ink);line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:var(--cream);padding:28px 16px 56px;text-align:center;position:relative}
header::after{content:"";position:absolute;inset:auto 0 -1px 0;height:40px;background:var(--cream);clip-path:polygon(0 100%,50% 0,100% 100%)}
header img{width:150px;height:150px;border-radius:50%;border:4px solid var(--cream);background:var(--cream)}
header h1{font-size:2rem;font-weight:800;margin-top:8px}
header p{opacity:.85}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;margin:8px 0 20px}
.bar input{flex:1;padding:10px 14px;border:2px solid var(--navy);border-radius:10px;background:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--paper);border:2px solid var(--navy);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;background:var(--navy) center/cover;display:grid;place-items:center;color:var(--cream);font-size:2.4rem;position:relative}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:1.1rem}
.card p{color:var(--mute);font-size:.92rem;flex:1}
.price{font-weight:800;font-size:1.2rem;color:var(--navy)}
.old{text-decoration:line-through;color:var(--mute);font-weight:400;font-size:.95rem;margin-inline-start:8px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--red);color:#fff;font-size:.8rem;padding:2px 10px;border-radius:99px;font-weight:600}
.tag.gone{background:#555}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.btn{background:var(--navy);color:var(--cream);border:0;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.red{background:var(--red)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e0a800;outline-offset:2px}
footer{text-align:center;color:var(--mute);padding:30px 16px;font-size:.9rem}
footer a{color:var(--mute);cursor:pointer;text-decoration:none;opacity:.6}
.modal{position:fixed;inset:0;background:rgba(19,19,90,.6);display:none;place-items:center;padding:16px;z-index:9}
.modal.open{display:grid}
.box{background:var(--paper);border-radius:16px;padding:22px;width:100%;max-width:400px;border:3px solid var(--navy)}
.box h2{margin-bottom:10px}
.box input,.panel input,.panel textarea{width:100%;padding:9px 12px;margin:5px 0;border:2px solid var(--line);border-radius:10px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.err{color:var(--red);min-height:1.4em;font-size:.9rem}
.panel{background:var(--paper);border:3px solid var(--navy);border-radius:16px;padding:18px;margin-bottom:24px;display:none}
.panel.open{display:block}
.panel h2{margin-bottom:6px}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.who{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.badge{background:var(--navy);color:var(--cream);padding:1px 10px;border-radius:99px;font-size:.8rem}
.cartfab{position:fixed;bottom:16px;inset-inline-start:16px;z-index:8;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:12px 20px}
.cartfab b{background:var(--cream);color:var(--navy);border-radius:99px;padding:0 9px;margin-inline-start:6px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:2px solid var(--navy);background:transparent;cursor:pointer;font-weight:800}
.up{display:inline-block;border:2px dashed var(--navy);border-radius:10px;padding:8px 14px;cursor:pointer;margin:5px 0;font-weight:600}
#fPrev{display:block;max-width:140px;border-radius:10px;margin:6px 0;border:2px solid var(--line)}
.box.wide{max-width:520px;max-height:90vh;overflow:auto}
.ok{color:#14683a;font-weight:600;padding:14px 0}
.ord{border-top:1px solid var(--line);padding:10px 0}
.card .btn:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:520px){.panel .two{grid-template-columns:1fr}header h1{font-size:1.5rem}}
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="شعار تي إكليسيا">
  <h1>تي إكليسيا</h1>
  <p>للمستلزمات الكنسية · أولاد وهيب</p>
</header>

<main>
  <!-- لوحة الموظفين: تظهر فقط بعد تسجيل دخول حساب مصرح له -->
  <section class="panel" id="panel">
    <div class="who">
      <h2>لوحة التحكم <span class="badge" id="roleBadge"></span></h2>
      <div><span id="whoami"></span> <button class="btn alt" id="logout">خروج</button></div>
    </div>
    <h3 id="formTitle">إضافة منتج</h3>
    <input id="fName" placeholder="اسم المنتج">
    <div class="two">
      <input id="fPrice" type="number" min="0" placeholder="السعر (ج.م)">
      <input id="fDisc" type="number" min="0" max="100" placeholder="خصم % (اختياري)">
    </div>
    <textarea id="fDesc" rows="2" placeholder="الوصف"></textarea>
    <label class="up">📷 اختر صورة المنتج<input type="file" id="fFile" accept="image/*" hidden></label>
    <img id="fPrev" alt="" hidden><input id="fImg" type="hidden">
    <label><input type="checkbox" id="fAvail" checked style="width:auto"> متاح للبيع</label>
    <div class="row"><button class="btn" id="save">حفظ المنتج</button><button class="btn alt" id="cancel" hidden>إلغاء التعديل</button></div>
    <div class="err" id="formErr"></div>
    <h3 style="margin-top:10px" id="mineTitle">منتجاتي</h3>
    <div id="mine"></div>

    <h3 style="margin-top:16px">الطلبات</h3>
    <div id="orders"></div>
    <div id="ownerOnly" hidden>
      <h3 style="margin-top:16px">الموظفون</h3>
      <p style="color:var(--mute);font-size:.9rem">أنشئ حساب للموظف باسم مستخدم (إنجليزي) وكلمة مرور، وسلّمهم له. هيدخل بيهم ويضيف منتجات.</p>
      <div class="row"><input id="stUser" placeholder="اسم المستخدم" dir="ltr" autocapitalize="none" style="flex:1;min-width:140px"><input id="stPass" placeholder="كلمة المرور" dir="ltr" style="flex:1;min-width:140px"><button class="btn" id="addStaff">إنشاء حساب</button></div>
      <div class="err" id="stErr"></div>
      <div id="staffList"></div>
    </div>
  </section>

  <div class="bar"><input id="q" type="search" placeholder="ابحث عن منتج..."></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>لا توجد منتجات حالياً.</div>
</main>

<footer>
  تي إكليسيا للمستلزمات الكنسية<br>
  <a id="staffLink">دخول</a>
</footer>

<button class="btn cartfab" id="cartBtn">🛒 السلة <b id="cartN">0</b></button>

<div class="modal" id="cartM">
  <div class="box wide">
    <h2>سلة المشتريات</h2>
    <div id="cartList"></div>
    <div id="cartTotal" class="price" style="margin:8px 0"></div>
    <div id="checkout" hidden>
      <input id="oName" placeholder="الاسم" autocomplete="name">
      <input id="oPhone" type="tel" placeholder="رقم التليفون (هنتواصل معاك عليه)" autocomplete="tel">
      <input id="oAddr" placeholder="العنوان (اختياري)">
      <input id="oNote" placeholder="ملاحظات (اختياري)">
    </div>
    <div class="err" id="cartErr"></div>
    <div class="row"><button class="btn" id="buy" hidden>تأكيد الطلب</button><button class="btn alt" id="cartClose">إغلاق</button></div>
  </div>
</div>

<div class="modal" id="login">
  <div class="box">
    <h2>دخول الموظفين</h2>
    <input id="lUser" placeholder="اسم المستخدم" autocomplete="username" autocapitalize="none" dir="ltr">
    <input id="lPass" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
    <div class="err" id="lErr"></div>
    <div class="row">
      <button class="btn" id="eIn">دخول</button>
      <button class="btn alt" id="lClose">إغلاق</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== 1) ضع بيانات مشروعك من Firebase Console ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDaGFRWdbemR_L2TOgJO5Wu_h8eGm28mQY",
  authDomain: "ti-ekklesia-a34a5.firebaseapp.com",
  projectId: "ti-ekklesia-a34a5",
  storageBucket: "ti-ekklesia-a34a5.firebasestorage.app",
  messagingSenderId: "711367277578",
  appId: "1:711367277578:web:f7f3ee27a831acbd5533f3"
};
/* ===== 2) اسم مستخدم المشرف الأساسي (إنجليزي، حروف صغيرة) - لازم يتطابق مع الحساب اللي هتعمله في Firebase ===== */
const DOMAIN = "@ti-ekklesia.app";
const OWNER_USERS = ["moalim7salieb12"];
const toEmail = u => u.trim().toLowerCase() + DOMAIN;
const OWNERS = OWNER_USERS.map(toEmail);

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n).toLocaleString("ar-EG", {maximumFractionDigits: 2}) + " ج.م";

let products = [], user = null, role = null, editId = null;

/* ---------- المتجر (للجميع) ---------- */
db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => {
  products = s.docs.map(d => ({id: d.id, ...d.data()}));
  render(); renderMine(); updCart(); if ($("cartM").classList.contains("open")) renderCart();
}, e => { $("empty").hidden = false; $("empty").textContent = "تعذر تحميل المنتجات. راجع إعدادات Firebase."; });

function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = products.filter(p => !q || (p.name + " " + p.desc).toLowerCase().includes(q));
  $("empty").hidden = list.length > 0;
  if (list.length) $("empty").textContent = "";
  else $("empty").textContent = "لا توجد منتجات حالياً.";
  $("grid").innerHTML = list.map(p => {
    const d = Number(p.discount) || 0, final = p.price * (1 - d / 100);
    const ph = p.img ? `style="background-image:url('${esc(p.img)}')"` : "";
    return `<article class="card">
      <div class="ph" ${ph}>${p.img ? "" : "✝"}${p.available === false ? '<span class="tag gone">نفد</span>' : d ? `<span class="tag">خصم ${d}%</span>` : ""}</div>
      <div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
      <div class="price">${money(final)}${d ? `<span class="old">${money(p.price)}</span>` : ""}</div>
      <button class="btn" data-add="${p.id}" ${p.available === false ? "disabled" : ""}>أضف للسلة</button></div></article>`;
  }).join("");
}
$("q").oninput = render;

/* ---------- تسجيل الدخول (مخفي: رابط صغير بالأسفل) ---------- */
$("staffLink").onclick = () => { $("login").classList.add("open"); $("lErr").textContent = ""; };
$("lClose").onclick = () => $("login").classList.remove("open");
const showErr = e => $("lErr").textContent = ({
  "auth/invalid-credential":"اسم المستخدم أو كلمة المرور غير صحيحة",
  "auth/too-many-requests":"محاولات كتير، استنى شوية وحاول تاني",
  "auth/email-already-in-use":"هذا الإيميل مسجل بالفعل، اضغط دخول",
  "auth/weak-password":"كلمة المرور قصيرة (6 أحرف على الأقل)",
  "auth/invalid-email":"الإيميل غير صالح",
  "auth/unauthorized-domain":"الدومين ده مش مضاف في Firebase ← Authorized domains",
  "auth/popup-closed-by-user":"اتقفلت نافذة الدخول، حاول تاني",
  "auth/operation-not-allowed":"طريقة الدخول دي مش مفعلة في Firebase"
}[e.code] || "تعذر تسجيل الدخول: " + e.code);
const USER_RE = /^[a-z0-9._-]{3,30}$/;
$("eIn").onclick = () => {
  const u = $("lUser").value.trim().toLowerCase().split("@")[0];
  if (!USER_RE.test(u)) { $("lErr").textContent = "اسم المستخدم بحروف إنجليزية وأرقام فقط (3 أحرف على الأقل)."; return; }
  $("lErr").textContent = "";
  auth.signInWithEmailAndPassword(toEmail(u), $("lPass").value).catch(showErr);
};
$("lPass").onkeydown = e => { if (e.key === "Enter") $("eIn").click(); };
$("logout").onclick = () => auth.signOut();

auth.onAuthStateChanged(async u => {
  user = u; role = null;
  if (u) {
    const mail = (u.email || "").toLowerCase();
    if (OWNERS.includes(mail)) role = "owner";
    else {
      try { role = (await db.collection("staff").doc(mail).get()).exists ? "staff" : null; } catch (e) { role = null; }
    }
    if (!role) { $("lErr").textContent = "هذا الحساب غير مصرح له بالدخول."; auth.signOut(); return; }
    $("login").classList.remove("open");
  }
  $("panel").classList.toggle("open", !!role);
  $("staffLink").hidden = !!role;
  $("ownerOnly").hidden = role !== "owner";
  if (role) {
    $("roleBadge").textContent = role === "owner" ? "مشرف" : "موظف";
    $("whoami").textContent = u.email.split("@")[0];
    $("mineTitle").textContent = role === "owner" ? "كل المنتجات" : "منتجاتي";
    if (role === "owner") loadStaff();
    watchOrders();
  } else stopOrders();
  renderMine();
});

/* ---------- إضافة وتعديل المنتجات ---------- */
function resetForm() {
  editId = null;
  ["fName","fPrice","fDisc","fDesc","fImg"].forEach(i => $(i).value = "");
  showPrev(""); $("fAvail").checked = true; $("formTitle").textContent = "إضافة منتج"; $("cancel").hidden = true; $("formErr").textContent = "";
}
$("cancel").onclick = resetForm;
$("save").onclick = async () => {
  const name = $("fName").value.trim(), price = parseFloat($("fPrice").value), disc = parseFloat($("fDisc").value) || 0;
  if (!name || isNaN(price) || price < 0) { $("formErr").textContent = "اكتب اسم المنتج وسعراً صحيحاً."; return; }
  if (disc < 0 || disc > 100) { $("formErr").textContent = "الخصم بين 0 و 100."; return; }
  const data = {name, price, discount: disc, desc: $("fDesc").value.trim(), img: $("fImg").value.trim(), available: $("fAvail").checked};
  try {
    if (editId) await db.collection("products").doc(editId).update(data);
    else await db.collection("products").add({...data, uid: user.uid, by: user.email.split("@")[0], createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    resetForm();
  } catch (e) { $("formErr").textContent = "تعذر الحفظ: " + e.code; }
};
function renderMine() {
  if (!role) { $("mine").innerHTML = ""; return; }
  const mine = products.filter(p => role === "owner" || p.uid === user.uid);
  $("mine").innerHTML = mine.length ? mine.map(p => `<div class="item"><span><b>${esc(p.name)}</b> — ${money(p.price)}${p.discount ? ` (خصم ${p.discount}%)` : ""}${role === "owner" ? ` <small style="color:var(--mute)">· ${esc(p.by)}</small>` : ""}</span>
    <span class="row" style="margin:0"><button class="btn alt" data-e="${p.id}">تعديل</button><button class="btn red" data-d="${p.id}">حذف</button></span></div>`).join("")
    : '<div class="empty">لم تضف منتجات بعد. املأ النموذج بالأعلى.</div>';
}
$("mine").onclick = async e => {
  const ed = e.target.dataset.e, del = e.target.dataset.d;
  if (ed) {
    const p = products.find(x => x.id === ed); editId = ed;
    $("fName").value = p.name; $("fPrice").value = p.price; $("fDisc").value = p.discount || "";
    $("fDesc").value = p.desc || ""; $("fImg").value = p.img || ""; showPrev(p.img || ""); $("fAvail").checked = p.available !== false;
    $("formTitle").textContent = "تعديل منتج"; $("cancel").hidden = false; $("panel").scrollIntoView({behavior: "smooth"});
  }
  if (del && confirm("حذف هذا المنتج نهائياً؟")) db.collection("products").doc(del).delete().catch(x => alert("تعذر الحذف: " + x.code));
};

/* ---------- إدارة الموظفين (للمشرف فقط) ---------- */
async function loadStaff() {
  try {
    const s = await db.collection("staff").get();
    $("staffList").innerHTML = s.docs.length ? s.docs.map(d => `<div class="item"><span>${esc(d.id.split("@")[0])}</span><button class="btn red" data-r="${esc(d.id)}">إزالة</button></div>`).join("") : '<div class="empty">لا يوجد موظفون بعد.</div>';
  } catch (e) {}
}
let second = null;
$("addStaff").onclick = async () => {
  const u = $("stUser").value.trim().toLowerCase(), pw = $("stPass").value, err = $("stErr");
  err.textContent = "";
  if (!USER_RE.test(u)) { err.textContent = "اسم المستخدم بحروف إنجليزية وأرقام فقط (3 أحرف على الأقل)."; return; }
  if (pw.length < 6) { err.textContent = "كلمة المرور 6 أحرف على الأقل."; return; }
  if (OWNERS.includes(toEmail(u))) { err.textContent = "الاسم ده محجوز."; return; }
  try {
    second = second || firebase.initializeApp(firebaseConfig, "second");
    const a2 = second.auth();
    try { await a2.createUserWithEmailAndPassword(toEmail(u), pw); }
    catch (e) { if (e.code !== "auth/email-already-in-use") throw e; err.textContent = "الحساب كان موجود، تم تفعيله بكلمة مروره القديمة."; }
    await a2.signOut();
    await db.collection("staff").doc(toEmail(u)).set({username: u, addedAt: firebase.firestore.FieldValue.serverTimestamp()});
    $("stUser").value = $("stPass").value = ""; loadStaff();
  } catch (e) { err.textContent = "تعذر إنشاء الحساب: " + e.code; }
};
$("staffList").onclick = async e => {
  if (e.target.dataset.r && confirm("إزالة هذا الموظف؟")) { await db.collection("staff").doc(e.target.dataset.r).delete(); loadStaff(); }
};

/* ---------- رفع صورة من التليفون (بتتصغر وتتخزن مع المنتج) ---------- */
function shrink(file, max = 800) {
  return new Promise((ok, no) => {
    const r = new FileReader(); r.onerror = no;
    r.onload = () => {
      const i = new Image(); i.onerror = no;
      i.onload = () => {
        const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement("canvas");
        c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
        c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.72));
      };
      i.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function showPrev(src) { $("fPrev").hidden = !src; if (src) $("fPrev").src = src; }
$("fFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = await shrink(f); $("fImg").value = d; showPrev(d); }
  catch (x) { $("formErr").textContent = "تعذر قراءة الصورة، جرب صورة تانية."; }
};

/* ---------- السلة ---------- */
let cart = {};
try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch (e) {}
const unit = p => p.price * (1 - (Number(p.discount) || 0) / 100);
function saveCart() { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {} updCart(); }
function cartLines() {
  return Object.entries(cart).map(([id, q]) => { const p = products.find(x => x.id === id); return p && p.available !== false ? {p, q} : null; }).filter(Boolean);
}
function updCart() { $("cartN").textContent = cartLines().reduce((a, l) => a + l.q, 0); }
function renderCart() {
  const L = cartLines();
  $("cartList").innerHTML = L.length ? L.map(({p, q}) => `<div class="item"><span>${esc(p.name)}<br><small>${money(unit(p))}</small></span>
    <span class="qty"><button data-m="${p.id}">−</button>${q}<button data-p="${p.id}">+</button></span></div>`).join("")
    : '<div class="empty">السلة فاضية. أضف منتجات من الصفحة.</div>';
  $("cartTotal").textContent = L.length ? "الإجمالي: " + money(L.reduce((a, l) => a + unit(l.p) * l.q, 0)) : "";
  $("checkout").hidden = $("buy").hidden = !L.length;
}
$("grid").onclick = e => {
  const id = e.target.dataset.add; if (!id) return;
  cart[id] = (cart[id] || 0) + 1; saveCart();
  e.target.textContent = "تمت الإضافة ✓"; setTimeout(() => e.target.textContent = "أضف للسلة", 900);
};
$("cartBtn").onclick = () => { $("cartErr").textContent = ""; renderCart(); $("cartM").classList.add("open"); };
$("cartClose").onclick = () => $("cartM").classList.remove("open");
$("cartList").onclick = e => {
  const m = e.target.dataset.m, a = e.target.dataset.p;
  if (m) { cart[m]--; if (cart[m] <= 0) delete cart[m]; }
  if (a) cart[a]++;
  if (m || a) { saveCart(); renderCart(); }
};
$("buy").onclick = async () => {
  const L = cartLines(), name = $("oName").value.trim();
  const phone = $("oPhone").value.trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[\s-]/g, "");
  if (!L.length) return;
  if (name.length < 2) { $("cartErr").textContent = "اكتب اسمك."; return; }
  if (!/^\+?[0-9]{8,15}$/.test(phone)) { $("cartErr").textContent = "اكتب رقم تليفون صحيح."; return; }
  $("buy").disabled = true; $("cartErr").textContent = "";
  const total = Math.round(L.reduce((a, l) => a + unit(l.p) * l.q, 0) * 100) / 100;
  try {
    await db.collection("orders").add({
      name, phone, address: $("oAddr").value.trim(), note: $("oNote").value.trim(),
      items: L.map(({p, q}) => ({id: p.id, name: p.name, price: Math.round(unit(p) * 100) / 100, qty: q})),
      total, status: "new", createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    cart = {}; saveCart();
    $("cartList").innerHTML = '<p class="ok">تم استلام طلبك ✓ هنتواصل معاك على رقمك قريباً.</p>';
    $("cartTotal").textContent = ""; $("checkout").hidden = $("buy").hidden = true;
  } catch (e) { $("cartErr").textContent = "تعذر إرسال الطلب: " + e.code; }
  $("buy").disabled = false;
};

/* ---------- الطلبات (للمشرف والموظفين) ---------- */
let unsubOrders = null;
const stLabel = {new: "جديد", contacted: "تم التواصل", done: "تم التسليم"};
function stopOrders() { if (unsubOrders) unsubOrders(); unsubOrders = null; $("orders").innerHTML = ""; }
function watchOrders() {
  if (unsubOrders) return;
  unsubOrders = db.collection("orders").orderBy("createdAt", "desc").limit(100).onSnapshot(s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()}));
    $("orders").innerHTML = L.length ? L.map(o => {
      const n = String(o.phone).replace(/\D/g, "").replace(/^0/, "20");
      return `<div class="ord"><b>${esc(o.name)}</b> <span class="badge">${stLabel[o.status] || ""}</span><br>
        <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · <a href="https://wa.me/${n}" target="_blank" rel="noopener">واتساب</a>
        ${o.address ? "<br>" + esc(o.address) : ""}${o.note ? "<br><small>" + esc(o.note) + "</small>" : ""}
        <ul style="padding-inline-start:20px">${(o.items || []).map(i => `<li>${esc(i.name)} × ${i.qty}</li>`).join("")}</ul>
        <b>${money(o.total)}</b>
        <div class="row"><button class="btn alt" data-s="contacted" data-o="${o.id}">تم التواصل</button><button class="btn alt" data-s="done" data-o="${o.id}">تم التسليم</button><button class="btn red" data-x="${o.id}">حذف</button></div></div>`;
    }).join("") : '<div class="empty">لا توجد طلبات.</div>';
  }, e => { $("orders").textContent = "تعذر تحميل الطلبات: " + e.code; });
}
$("orders").onclick = e => {
  const d = e.target.dataset;
  if (d.s) db.collection("orders").doc(d.o).update({status: d.s});
  if (d.x && confirm("حذف الطلب نهائياً؟")) db.collection("orders").doc(d.x).delete();
};
</script>
</body>
